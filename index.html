<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GUAU SHOP</title>

    <meta name="description"
        content="GUAU es una tienda de accesorios para perros inspirada en la estética Y2K. Collares, correas y productos con estilo, personalidad y mucha actitud.">

    <meta name="theme-color" content="#000000">

    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">

    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/header.css">
    <link rel="stylesheet" href="/css/slider.css">
    <link rel="stylesheet" href="/css/cart.css">
    <link rel="stylesheet" href="/css/footer.css">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@8/swiper-bundle.min.css" />

    <script src="https://code.jquery.com/jquery-3.6.3.min.js"
        integrity="sha256-pvPw+upLPUjgMXY0G+8O0xUf+/Im1MZjXxxgOcBQBXU=" crossorigin="anonymous"></script>

    <script src="//lunge.world/cdn/shop/t/2/assets/SwupBodyClassPlugin.min.js?v=13" type="text/javascript"></script>
</head>

<body class="template-index">
    <div id="mini-cart" class="panel cart-panel">
        <div class="cart-panel__content">
            <div class="cart-panel__inner">

                <!-- Cart header -->
                <div class="cart-panel__header">
                    <p class="cart-panel__title">
                        Carrito (<span id="cart-count">0</span>)
                    </p>

                    <button type="button" class="close-panel menu-close" aria-label="Cerrar carrito">
                        <svg class="menu-close-icon" width="41" height="41" viewBox="0 0 41 41" fill="none"
                            xmlns="http://www.w3.org/2000/svg">
                            <rect width="41" height="41" rx="10" fill="black" />
                            <rect x="25.9004" y="16.25" width="14" height="1.2" transform="rotate(135 25.9004 16.25)"
                                fill="#F6F5F0" />
                            <rect x="24.9004" y="26.25" width="14" height="1.2" transform="rotate(-135 24.9004 26.25)"
                                fill="#F6F5F0" />
                        </svg>
                    </button>
                </div>

                <!-- Empty cart -->
                <div class="cart-panel__empty empty-state">
                    <p class="cart-panel__empty-message">
                        Tu carrito está vacío
                    </p>

                    <div class="cart-panel__footer">
                        <a href="/pages/all" class="cart-panel__shop-button">
                            Explorar productos
                        </a>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <div id="menu-content" class="panel menu-panel">
        <div class="menu-header">
            <p class="menu-title">Menú</p>

            <div class="close-panel menu-close" role="button" tabindex="0" aria-label="Cerrar menú">
                <svg class="menu-close-icon" width="41" height="41" viewBox="0 0 41 41" fill="none"
                    xmlns="http://www.w3.org/2000/svg">
                    <rect width="41" height="41" rx="10" fill="black" />
                    <rect x="25.9004" y="16.25" width="14" height="1.2" transform="rotate(135 25.9004 16.25)"
                        fill="#F6F5F0" />
                    <rect x="24.9004" y="26.25" width="14" height="1.2" transform="rotate(-135 24.9004 26.25)"
                        fill="#F6F5F0" />
                </svg>
            </div>
        </div>

        <div class="menu-navigation">
            <a class="menu-link" href="/pages/all-items.html">Todo</a>
            <a class="menu-link" href="/pages/accessories">Accesorios</a>
            <a class="menu-link" href="/pages/bundle-save">Paquete y Ahorro</a>
            <a class="menu-link" href="/pages/collar">Collares</a>
            <a class="menu-link" href="/pages/harness">Arneses</a>
            <a class="menu-link" href="/pages/leash">Correas</a>
        </div>

        <div class="menu-info">
            <a class="menu-link" href="/pages/about">Información</a>
        </div>
    </div>


    <div class="page-container">
        <header id="header-div" class="site-header">
            <!-- DINAMIC CONTENT -->
        </header>

        <main role="main" id="swup" class="page-transition">
            <section id="shopify-section-slider" class="shopify-section hero-section">

                <div class="home-slider hero-slider">
                    <div class="swiper-wrapper" id="hero-slides"><!-- DINAMIC CONTENT --></div>

                    <div class="mobile-slider-scrollbar">
                        <div class="slider-scrollbar"></div>
                    </div>
                </div>

                <div class="slider-thumbs thumbnail-slider">
                    <div class="swiper-wrapper thumbnail-wrapper" id="slider-thumbnails"><!-- DINAMIC CONTENT --></div>
                </div>
            </section>
        </main>

        <footer id="footer-div" class="footer">
            <!-- DINAMIC CONTENT -->
        </footer>
    </div>

    <div class="panel-overlay"></div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@8/swiper-bundle.min.js"></script>

    <script src="/js/header.js"></script>
    <script src="/js/slider-data.js"></script>
    <script src="/js/slider-render.js"></script>
    <script src="/js/slider.js"></script>
    
    <script src="/layout/header.js"></script>
    <script src="/layout/footer.js"></script>
</body>

</html>
